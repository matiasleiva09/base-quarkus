quarkus.http.port=8080
quarkus.shutdown.timeout=60s
quarkus.log.category."org.eclipse.microprofile.rest.client".level=INFO
quarkus.log.category."org.jboss.resteasy.resteasy-client".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] [%t] %-5p %c{2.}.%M - %s%e%n
#LEVANTAR SWAGGER##
%dev.quarkus.swagger-ui.always-include=true
#quarkus.smallrye-openapi.path=/base-api/openapi
quarkus.swagger-ui.path=/base-api/swagger-ui

mp.openapi.info.title=Base Component API
mp.openapi.info.version=2.0.0
mp.openapi.info.description=Template base para componentes Quarkus


